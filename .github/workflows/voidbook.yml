name: Build sqawk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # No dependency caching: a stale node/gradle cache was the source of the
      # corrupted native build previously, so every run installs and prebuilds fresh.
      - name: Install deps
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Write .env
        working-directory: mobile
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$EXPO_PUBLIC_SUPABASE_URL" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          printf 'EXPO_PUBLIC_WORKER_URL=%s\n' "$EXPO_PUBLIC_WORKER_URL" >> .env

      - name: Expo prebuild (regenerates android/ from scratch)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Pin Gradle 8.6, disable Proguard, tune JVM
        run: |
          WRAPPER=mobile/android/gradle/wrapper/gradle-wrapper.properties
          if grep -q 'gradle-8.6-bin.zip' "$WRAPPER"; then
            sed -i 's/gradle-8.6-bin.zip/gradle-8.6-bin.zip/g' "$WRAPPER"
          fi
          # Expo 51 targets Gradle 8.6; fail loudly if the wrapper is unexpected.
          grep -q 'gradle-8.6-bin.zip' "$WRAPPER" || { echo "Unexpected Gradle wrapper:"; cat "$WRAPPER"; exit 1; }
          sed -i 's/minifyEnabled true/minifyEnabled false/g' mobile/android/app/build.gradle
          {
            echo 'android.enableProguardInReleaseBuilds=false'
            echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m'
          } >> mobile/android/gradle.properties

      - name: Configure release signing
        working-directory: mobile/android/app
        run: |
          # prebuild may emit a debug.keystore whose alias collides with the one
          # we generate below; remove it first to avoid "alias already exists".
          rm -f debug.keystore
          cat >> build.gradle << 'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE_EOF
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=sqawk"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/sqawk.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: sqawk v1.0.${{ github.run_number }}
          files: artifacts/*.apk
