name: VOIDBOOK Full APK Build & Commit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voidbook-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Publish VOIDBOOK APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: npm-v2-nocam-${{ github.run_id }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-nocam-${{ github.run_id }}

      - name: Purge node_modules and lockfile
        working-directory: mobile
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          ls -la | head -20
          echo "  ✓ node_modules + lockfile purged"

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Force-remove expo-camera after install
        working-directory: mobile
        run: |
          rm -rf node_modules/expo-camera node_modules/expo-image-picker
          echo "  ✓ explicitly removed camera dirs after npm install"
          ls node_modules | grep -c camera || echo "  0 camera modules present"

      - name: Expo Prebuild (Generate Native Android)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Configure Release Signing
        working-directory: mobile/android/app
        run: |
          if ! grep -q "signingConfigs" build.gradle; then
            cat >> build.gradle << 'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE_EOF
          fi
          rm -f debug.keystore
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VOIDBOOK, OU=VOID, O=VOIDIAL, L=VOID, S=VOID, C=US"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties

      - name: Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK (debug)
        run: |
          echo "=== Searching for every .apk under mobile/android ==="
          find mobile/android -name "*.apk" -type f -exec ls -lh {} \; || true
          echo "=== Outputs tree ==="
          find mobile/android/app/build/outputs -type f 2>/dev/null | head -50 || true

      - name: Copy APK to artifacts directory
        run: |
          mkdir -p artifacts
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced by gradle — build failed silently"
            exit 1
          fi
          cp "$APK" artifacts/VOIDBOOK-v1.0.${{ github.run_number }}.apk
          ls -lh artifacts/
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload VOIDBOOK APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidbook-apk-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VOIDBOOK v1.0.${{ github.run_number }}
          body: |
            ## VOIDBOOK Automated Build #${{ github.run_number }}
            - Commit: `${{ github.sha }}`
            - Features: auth · feed · messaging · live · marketplace · profile · settings
          files: artifacts/*.apk
          generate_release_notes: false
