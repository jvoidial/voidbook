name: VOIDBOOK Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voidbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VOIDBOOK APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Purge stale caches
        working-directory: mobile
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install deps
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Write .env for Metro
        working-directory: mobile
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$EXPO_PUBLIC_SUPABASE_URL" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          printf 'EXPO_PUBLIC_WORKER_URL=%s\n' "$EXPO_PUBLIC_WORKER_URL" >> .env
          echo "  .env (redacted):"
          sed 's/=.*/=<set>/' .env

      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Configure release signing
        working-directory: mobile/android/app
        run: |
          if ! grep -q "signingConfigs" build.gradle; then
            cat >> build.gradle << 'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE_EOF
          fi
          rm -f debug.keystore
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VOIDBOOK, OU=VOID, O=VOIDIAL, L=VOID, S=VOID, C=US"

      - name: Metro bundle pre-check
        working-directory: mobile
        run: |
          npx expo export:embed \
            --entry-file=index.js \
            --platform=android \
            --dev=false \
            --bundle-output=/tmp/precheck.bundle \
            --assets-dest=/tmp/precheck-assets 2>&1 | tail -40

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties

      - name: Wipe Gradle cache
        run: |
          rm -rf mobile/android/.gradle
          rm -rf mobile/android/app/build
          rm -rf mobile/android/build
          rm -rf mobile/android/app/.cxx

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            find mobile/android -name "*.apk" -type f -exec ls -lh {} \;
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" "artifacts/VOIDBOOK-v1.0.${{ github.run_number }}.apk"
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: voidbook-apk-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VOIDBOOK v1.0.${{ github.run_number }}
          body: |
            Automated build #${{ github.run_number }}
            Commit: `${{ github.sha }}`
          files: artifacts/*.apk
