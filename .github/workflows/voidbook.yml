name: Build sqawk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}
      EXPO_PUBLIC_LIVEKIT_URL: ${{ secrets.EXPO_PUBLIC_LIVEKIT_URL }}
      EXPO_PUBLIC_LIVEKIT_API_KEY: ${{ secrets.EXPO_PUBLIC_LIVEKIT_API_KEY }}
      EXPO_PUBLIC_LIVEKIT_API_SECRET: ${{ secrets.EXPO_PUBLIC_LIVEKIT_API_SECRET }}
      EXPO_PUBLIC_LIVEKIT_TOKEN_SERVER_ID: ${{ secrets.EXPO_PUBLIC_LIVEKIT_TOKEN_SERVER_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Clear caches
        run: |
          rm -rf mobile/node_modules
          rm -rf mobile/android
          rm -f mobile/package-lock.json

      - name: Install deps
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Write .env
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          echo "EXPO_PUBLIC_WORKER_URL=$EXPO_PUBLIC_WORKER_URL" >> .env

      - name: Expo Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Force Gradle 8.6
        run: |
          sed -i 's/gradle-8.8-all.zip/gradle-8.6-all.zip/g' mobile/android/gradle/wrapper/gradle-wrapper.properties
          echo "android.enableProguardInReleaseBuilds=false" >> mobile/android/gradle.properties

      - name: Configure Release Signing
        working-directory: mobile/android/app
        run: |
          if ! grep -q "signingConfigs" build.gradle; then
            cat >> build.gradle << 'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE_EOF
          fi
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=sqawk"

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload & Release
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/sqawk-v1.0.apk
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: sqawk-apk
          path: artifacts/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: sqawk v1.0.${{ github.run_number }}
          files: artifacts/*.apk
