name: Build sqawk (iOS, unsigned IPA)

# Produces an UNSIGNED .ipa for sideloading (AltStore / SideStore / Sideloadly /
# TrollStore). No Apple Developer account, certificate or provisioning profile is
# needed: the app is built with code signing disabled and packaged as a
# Payload/ zip, which is all an .ipa is. The sideloading tool signs it on install
# with the user's own Apple ID.
#
# This is for putting the app on your own device. A sideloading tool signs with a
# personal certificate, which is not a licence to distribute to other people.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Write .env
        working-directory: mobile
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$EXPO_PUBLIC_SUPABASE_URL" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          printf 'EXPO_PUBLIC_WORKER_URL=%s\n' "$EXPO_PUBLIC_WORKER_URL" >> .env
          printf 'EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=%s\n' "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" >> .env

      - name: Expo prebuild (iOS)
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install pods
        working-directory: mobile/ios
        run: pod install

      # `build` (not `archive`) with signing disabled. An archive would still try
      # to apply a signing identity on export; a plain device build with
      # CODE_SIGNING_ALLOWED=NO produces a runnable .app and no signature at all.
      - name: Build unsigned .app
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::No .app was produced by the build"; exit 1; }
          echo "Built: $APP"

          # Prove it is unsigned before shipping it. The definitive test is the
          # absence of the signing artifacts at the app bundle root: `codesign
          # -dv` writes to stderr with version-dependent wording, so parsing it
          # gives false alarms. Nested vendor frameworks may carry their own
          # signature; that is expected and the sideloader re-signs everything.
          if [ -e "$APP/_CodeSignature" ]; then
            echo "::error::$APP/_CodeSignature is present; the app is signed"
            exit 1
          fi
          if [ -e "$APP/embedded.mobileprovision" ]; then
            echo "::error::embedded.mobileprovision is present; the app is signed"
            exit 1
          fi
          echo "Confirmed unsigned: no _CodeSignature or embedded.mobileprovision at the app root."

          # An .ipa is a zip whose root holds the app in a Payload/ folder.
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # Remove anything signing-related so the sideloader signs a clean bundle.
          rm -rf "$RUNNER_TEMP/Payload/"*.app/_CodeSignature
          rm -f  "$RUNNER_TEMP/Payload/"*.app/embedded.mobileprovision

          cd "$RUNNER_TEMP"
          rm -f sqawk-unsigned.ipa
          zip -qry sqawk-unsigned.ipa Payload
          unzip -l sqawk-unsigned.ipa | head -5
          ls -lh sqawk-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: sqawk-unsigned.ipa
          path: ${{ runner.temp }}/sqawk-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ── Attach the IPA to the release the Android workflow created ──────────
      #
      # Android owns the tag. It creates the release roughly 10 minutes in; this
      # job takes about 20, so by the time we get here the release almost always
      # exists and this loop exits on the first try. It is here for the case where
      # iOS is dispatched on its own, or Android is slow or still building.
      - name: Wait for the Android release
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only accept a release whose tag points at this exact commit. Otherwise a
          # previous commit's release would match and the IPA would be attached to
          # the wrong version.
          for i in $(seq 1 60); do
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
              --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^v1[.]0[.][0-9]+$"))] | sort_by(.createdAt) | last | .tagName' || true)
            if [ -n "$tag" ] && [ "$tag" != "null" ]; then
              sha=$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}' || true)
              peeled=$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}' || true)
              if [ -n "$peeled" ]; then sha="$peeled"; fi
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "Attaching the IPA to $tag (points at this commit)."
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Newest release $tag is for ${sha:0:7}, not this commit (${GITHUB_SHA:0:7}); waiting…"
            else
              echo "No release yet (attempt $i/60); waiting 30s…"
            fi
            sleep 30
          done
          echo "::warning::No release for this commit appeared within 30 minutes; the IPA is available as a build artifact only."

      - name: Compute artifact name
        id: names
        if: steps.release.outputs.tag != ''
        run: |
          base="sqawk-${{ steps.release.outputs.tag }}-${GITHUB_SHA:0:7}-$(date -u +%Y%m%d)"
          echo "ipa=${base}-unsigned.ipa" >> "$GITHUB_OUTPUT"
          echo "Artifact: ${base}-unsigned.ipa"

      - name: Stage IPA for release
        if: steps.release.outputs.tag != ''
        run: |
          mkdir -p artifacts
          cp "$RUNNER_TEMP/sqawk-unsigned.ipa" "artifacts/${{ steps.names.outputs.ipa }}"

      - uses: softprops/action-gh-release@v2
        if: steps.release.outputs.tag != ''
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: artifacts/*.ipa
